<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e1e2f" id="meta-theme">
<title>مواقيت الصلاة - Ahmed Nx</title>
<style>
:root {
    --bg:#1e1e2f; --bg2:#2d3436; --text:#ffffff; --surface:#292b3c; --accent:#f1c40f; --muted:#9aa0a6;
    --border:rgba(255,255,255,.16); --hover:rgba(255,255,255,.08); --accent-soft:rgba(241,196,15,.18);
    --on-accent:#1a1a1a; --ok:#2ecc71; --danger:#e74c3c;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
[hidden] { display:none !important; }
html { -webkit-text-size-adjust:100%; }
body {
    margin:0; min-height:100vh; color:var(--text);
    font-family:'Tajawal','Noto Naskh Arabic','Segoe UI',Tahoma,Arial,sans-serif;
    background:linear-gradient(135deg,var(--bg),var(--bg2)) fixed;
    transition:background .3s,color .3s;
}
#app { max-width:460px; margin:0 auto; padding:1rem 1rem 6.5rem; }
.card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:1.4rem; padding:1.2rem; margin-bottom:1rem;
}
.muted { color:var(--muted); }
.center { text-align:center; }
h1 { font-size:1.15rem; margin:0; }
h3 { font-size:1rem; margin:0 0 .8rem; color:var(--accent); }
.small { font-size:.78rem; line-height:1.7; }

/* الصلاة القادمة */
.hero { text-align:center; border-bottom:4px solid var(--accent); }
#next-prayer-name { font-size:2.2rem; font-weight:700; color:var(--accent); margin:.1rem 0; }
#countdown { font-size:1.7rem; font-family:ui-monospace,Menlo,Consolas,monospace; direction:ltr; font-variant-numeric:tabular-nums; }
#next-prayer-time { font-size:.85rem; color:var(--muted); margin-top:.2rem; }
.bar { height:6px; border-radius:99px; background:var(--hover); overflow:hidden; margin-top:.9rem; }
.bar > i { display:block; height:100%; width:100%; background:var(--accent); transform:scaleX(0); transform-origin:left; transition:transform .6s; }
[dir=rtl] .bar > i { transform-origin:right; }

/* القائمة */
.prayer-row {
    background:var(--hover); margin-bottom:.55rem; padding:.9rem 1rem; border-radius:.9rem;
    display:flex; justify-content:space-between; align-items:center;
    border-inline-start:4px solid transparent; transition:.3s;
}
.prayer-row .time { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:1.05rem; }
.active-prayer { border-inline-start-color:var(--accent); background:var(--accent-soft); }

#error-box {
    background:rgba(231,76,60,.15); border:1px solid rgba(231,76,60,.5);
    border-radius:1rem; padding:1rem; text-align:center; margin-bottom:1rem; font-size:.9rem;
}

/* عناصر الإدخال */
button, select, input[type=text], input[type=number], input[type=time] {
    font-family:inherit; font-size:.9rem; color:var(--text);
    background:var(--hover); border:1px solid var(--border);
    border-radius:.8rem; padding:.6rem .9rem;
}
button { cursor:pointer; }
select { width:100%; }
input[type=time] { width:100%; text-align:center; }
.timerow { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
.timerow label { display:block; font-size:.75rem; color:var(--muted); margin-bottom:.2rem; }
select option { background:var(--surface); color:var(--text); }
input[type=text] { width:100%; }
input[type=number] { width:100%; text-align:center; padding:.45rem; }
input[type=color] { width:3rem; height:2.1rem; padding:0; border:1px solid var(--border); border-radius:.5rem; background:none; cursor:pointer; }
.btn-accent { background:var(--accent); color:var(--on-accent); border:none; font-weight:700; }
.btn-block { width:100%; }
.field { margin-bottom:.9rem; }
.field > label { display:block; font-size:.8rem; color:var(--muted); margin-bottom:.3rem; }
.switch { display:flex; align-items:center; justify-content:space-between; margin-bottom:.8rem; font-size:.92rem; }
.switch input { width:1.2rem; height:1.2rem; accent-color:var(--accent); }
.seg { display:flex; flex-wrap:wrap; background:var(--hover); border-radius:1rem; padding:.25rem; gap:.25rem; margin-bottom:1rem; }
.seg button { flex:1 1 auto; border:none; background:none; border-radius:.8rem; padding:.55rem .3rem; font-size:.82rem; color:var(--muted); }
.seg.scroll { flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:none; overscroll-behavior-x:contain; padding-inline:14px;
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%); mask-image:linear-gradient(to right,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%); }
.seg.scroll::-webkit-scrollbar { display:none; }
.seg.scroll button { flex:0 0 auto; white-space:nowrap; padding:.55rem .95rem; }
.seg button.on { background:var(--accent); color:var(--on-accent); font-weight:700; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
.grid2 label { display:block; font-size:.75rem; color:var(--muted); margin-bottom:.2rem; text-align:center; }

/* الثيمات */
.chips { display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:1rem; }
.chip {
    display:flex; align-items:center; gap:.5rem; padding:.5rem .8rem;
    border:1px solid var(--border); border-radius:99px; background:var(--hover); cursor:pointer; font-size:.85rem;
}
.chip.on { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
.sw { width:1rem; height:1rem; border-radius:50%; border:1px solid var(--border); flex:none; }
.chip .x { opacity:.7; padding:0 .2rem; }
.color-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:.6rem; font-size:.9rem; }


/* الأذكار */
.dhikr {
    background:var(--hover); border-radius:1rem; padding:.9rem; margin-bottom:.6rem;
    cursor:pointer; user-select:none; -webkit-user-select:none;
    display:flex; gap:.75rem; align-items:flex-start; transition:.2s; line-height:2;
}
.dhikr .badge {
    flex:none; min-width:2.2rem; height:2.2rem; border-radius:50%;
    background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-weight:700;
}
.dhikr .h { font-size:.75rem; color:var(--accent); line-height:1.4; margin-bottom:.2rem; }
.dhikr.done { opacity:.45; }
.dhikr.done .badge { background:rgba(46,204,113,.25); color:var(--ok); }
.dhikr > div:nth-child(2) { font-size:calc(1rem * var(--dfs, 1)); }
.dhikr .h { font-size:calc(.75rem * var(--dfs, 1)); }
.dhikr.fading { opacity:0; transform:scale(.97); pointer-events:none; }
.dhikr.gone { display:none; }
.dhikr.dragging { z-index:5; position:relative; transition:none; box-shadow:0 6px 18px rgba(0,0,0,.35); opacity:1; }
.dhikr.shifting { transition:transform .15s; }
.grip { flex:none; align-self:flex-start; background:none; border:none; padding:.2rem; color:var(--muted); line-height:0; touch-action:none; cursor:grab; }
.grip i[data-ic] { width:1.3em; height:1.3em; }
.abar { display:flex; flex-wrap:wrap; gap:.4rem; align-items:center; margin-bottom:.8rem; }
.abar button { background:var(--hover); border:1px solid transparent; border-radius:.8rem; padding:.4rem .7rem; font-size:.8rem; color:var(--muted); }
.abar button.on { background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }
.abar .fs { display:flex; align-items:center; gap:.2rem; }
.abar .fs span { min-width:2.6rem; text-align:center; font-size:.8rem; color:var(--muted); }
.abar2 { margin-top:-.3rem; }
#lib-continue { display:flex; width:100%; justify-content:space-between; align-items:center; gap:.5rem; background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent); border-radius:1rem; padding:.7rem .9rem; margin-bottom:.7rem; font-size:.85rem; }
#lib-continue span:last-child { font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.alldone { text-align:center; padding:1rem 0; color:var(--ok); }
.verse { font-size:1.15rem; line-height:2.1; }

/* التنقل السفلي */
#bottom-nav {
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background:var(--surface); border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);
}
#bottom-nav .inner { display:flex; max-width:460px; margin:0 auto; }
.nav-btn {
    flex:1; background:none; border:none; border-radius:0; color:var(--muted);
    display:flex; flex-direction:column; align-items:center; gap:.2rem;
    padding:.6rem .2rem .55rem; font-size:.72rem;
}
.nav-btn svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.nav-btn.on { color:var(--accent); }

#toast {
    position:fixed; bottom:6.6rem; left:50%; transform:translate(-50%,20px);
    background:#111; color:#fff; padding:.75rem 1.2rem; border-radius:1rem;
    border:1px solid rgba(255,255,255,.2); box-shadow:0 8px 24px rgba(0,0,0,.5);
    opacity:0; pointer-events:none; transition:.3s; z-index:50; max-width:90%; text-align:center; font-size:.9rem;
}
#toast.show { opacity:1; transform:translate(-50%,0); }
.sig { margin:.8rem 0 .5rem; text-align:center; font-size:15px; letter-spacing:.04em; color:var(--muted); direction:ltr; }

/* أيقونات Lucide */
.il { display:inline-flex; align-items:center; gap:.45em; }
.il-block { display:flex; align-items:center; justify-content:center; gap:.4em; }
.field > label.il { display:flex; }
.tc { display:flex; align-items:center; justify-content:center; }
.tc i[data-ic] { width:1em; height:1em; }
.chip .x i[data-ic] { width:.9em; height:.9em; }
.dhikr .badge i[data-ic] { width:1.1em; height:1.1em; }
i[data-ic] { display:inline-flex; width:1.15em; height:1.15em; flex:none; vertical-align:middle; }
i[data-ic] svg { width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.nav-btn i[data-ic] { width:24px; height:24px; }
.seg button { display:flex; align-items:center; justify-content:center; gap:.35rem; }
.ibtn { display:flex; align-items:center; justify-content:center; gap:.4rem; }
[dir=rtl] .flip svg { transform:scaleX(-1); }
.searchbox { display:flex; align-items:center; gap:.5rem; background:var(--hover); border:1px solid var(--border); border-radius:.8rem; padding:0 .8rem; color:var(--muted); }
.searchbox input { border:none; background:none; flex:1; padding:.65rem 0; outline:none; }
.cat-row { display:flex; align-items:center; justify-content:space-between; gap:.6rem; width:100%; text-align:start; background:var(--hover); border:none; border-radius:.9rem; padding:.8rem .9rem; margin-bottom:.45rem; line-height:1.7; }
.cat-row.grp { font-weight:700; border-inline-start:3px solid var(--accent); }
.cat-row .n { flex:none; font-size:.75rem; color:var(--accent); background:var(--accent-soft); border-radius:99px; padding:.1rem .55rem; }
.back-btn { display:flex; align-items:center; gap:.4rem; }

/* حلقة المسبحة */
.tasbih-wrap { position:relative; width:216px; height:216px; margin:.4rem auto; }
.tasbih-ring { position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); pointer-events:none; }
.tasbih-ring circle { fill:none; stroke-width:6; stroke-linecap:round; }
.tasbih-ring .trk { stroke:var(--hover); }
.tasbih-ring .prg { stroke:var(--accent); stroke-dasharray:590.62; stroke-dashoffset:590.62; transition:stroke-dashoffset .25s ease-out; }
.tasbih-wrap .tasbih-btn { position:absolute; inset:14px; width:auto; height:auto; margin:0; }

/* شريط التنقل يختفي مع التمرير لتحت */
#bottom-nav { transition:transform .28s ease, opacity .28s ease; will-change:transform; }
#bottom-nav.nav-hidden { transform:translateY(110%); }

/* المفضلة */
.dhikr > div:nth-child(2) { flex:1; min-width:0; }
.star { flex:none; align-self:flex-start; background:none; border:none; padding:.2rem; color:var(--muted); line-height:0; }
.star i[data-ic] { width:1.3em; height:1.3em; }
.star.on { color:var(--accent); }
.star.on svg { fill:currentColor; }
.dhikr { transition:opacity .2s, transform .12s; }
.dhikr:active { transform:scale(.985); }

/* انتقال الثيم */
#theme-fade { position:fixed; inset:0; z-index:-1; pointer-events:none; }
html.theme-anim *, html.theme-anim *::before, html.theme-anim *::after { transition:background-color .3s, border-color .3s, color .3s, fill .3s, stroke .3s !important; }
html.no-fx *, html.no-fx *::before, html.no-fx *::after { transition-duration:.01ms !important; animation-duration:.01ms !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration:.01ms !important; animation-duration:.01ms !important; } }

/* تصفح الأيام */
.daynav { display:flex; gap:.5rem; margin-bottom:.9rem; }
.daynav button { flex:1; padding:.5rem .3rem; font-size:.82rem; }

/* المسبحة */
.tasbih-btn {
    display:block; width:190px; height:190px; margin:.6rem auto; border-radius:50%;
    font-size:3.4rem; font-weight:700; font-variant-numeric:tabular-nums;
    background:var(--accent-soft); color:var(--accent); border:3px solid var(--accent);
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
.tasbih-btn:active { transform:scale(.97); background:var(--accent); color:var(--on-accent); }

/* جدول المواظبة */
.dhikr > div:nth-child(2) { font-family:var(--dff, inherit); }
.sub { margin-inline-start:1.7rem; }
.grp { margin:1rem 0 .5rem; font-size:.95rem; }
.grp:first-child { margin-top:0; }
.opts { background:var(--hover); border-radius:1rem; padding:.2rem .8rem; margin-bottom:.8rem; }
.opts summary { cursor:pointer; padding:.55rem 0; font-size:.85rem; color:var(--muted); list-style:none; }
.opts summary::-webkit-details-marker { display:none; }
.opts summary::after { content:'+'; float:inline-end; font-weight:700; }
.opts[open] summary::after { content:'−'; }
.gd > summary { color:var(--accent); font-weight:700; font-size:var(--fs-title); }
.gd .field:last-child, .gd .switch:last-child { margin-bottom:.6rem; }
.opts .abar { margin-bottom:.6rem; }
.heat { display:grid; grid-template-columns:repeat(10,1fr); gap:.25rem; margin:.5rem 0; }
.heat button { padding:0; border:none; }
.heat button { display:block; width:100%; aspect-ratio:1; border-radius:.3rem; background:var(--hover); position:relative; overflow:hidden; }
.heat button i { position:absolute; inset:0; background:var(--accent); }
.heat button.today { outline:1px solid var(--accent); outline-offset:1px; }
.heat button.sel { outline:2px solid var(--text); outline-offset:1px; }
.legend { display:flex; align-items:center; gap:.25rem; font-size:.72rem; color:var(--muted); margin-bottom:.8rem; }
.legend span.c { width:.8rem; height:.8rem; border-radius:.2rem; background:var(--hover); position:relative; overflow:hidden; display:inline-block; }
.legend span.c i { position:absolute; inset:0; background:var(--accent); }
.detail { font-size:.82rem; min-height:1.4em; margin:.2rem 0 .8rem; color:var(--text); }
.goal { margin:.3rem 0 .6rem; }
#adhkar-seg { flex-wrap:nowrap; }
#adhkar-seg button { flex:1 1 0; min-width:0; flex-direction:column; gap:.15rem; font-size:.74rem; padding:.5rem .1rem; }
.medals { display:flex; gap:.7rem; flex-wrap:wrap; margin:.4rem 0 1rem; }
.mw { display:flex; flex-direction:column; align-items:center; gap:.25rem; }
.mn { font-size:.72rem; color:var(--muted); }
.medal { position:relative; width:2.9rem; height:2.9rem; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--muted); overflow:hidden; }
.medal svg.mr { position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
.medal svg.mr circle { fill:none; stroke-width:3; }
.medal svg.mr .bg { stroke:var(--border); }
.medal svg.mr .pg { stroke:var(--accent); stroke-linecap:round; }
.medal i[data-ic] { width:1.3rem; height:1.3rem; position:relative; opacity:.55; }
.medal.next i[data-ic] { opacity:.8; }
.medal.on { background:var(--accent); color:var(--on-accent); }
.medal.on i[data-ic] { opacity:1; }
.medal.on svg.mr { display:none; }
.medal.new::after { content:''; position:absolute; inset:0; border-radius:50%; background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%); transform:translateX(-120%); animation:shine 1.1s ease .25s 1 forwards; }
@keyframes shine { to { transform:translateX(120%); } }
.bline { display:flex; justify-content:space-between; font-size:.85rem; margin-top:.4rem; }
#focus-exit { display:flex; opacity:0; transform:scale(.6); pointer-events:none; transition:opacity .25s ease, transform .25s ease; position:fixed; bottom:1rem; inset-inline-end:1rem; z-index:30; width:2.8rem; height:2.8rem; border-radius:50%; padding:0; align-items:center; justify-content:center; background:var(--surface); box-shadow:0 4px 14px rgba(0,0,0,.35); }
#focus-exit i[data-ic] { width:1.2em; height:1.2em; }
html.focus #bottom-nav { transform:translateY(110%); opacity:0; pointer-events:none; }
html.focus #focus-exit { opacity:1; transform:none; pointer-events:auto; }
html.focus #app { padding-bottom:1.5rem; }
#app { transition:padding-bottom .3s ease; }
#tab-adhkar h3[data-i18n=adhkarTitle] { max-height:2rem; overflow:hidden; transition:opacity .25s ease, max-height .3s ease, margin .3s ease; }
html.focus #tab-adhkar h3[data-i18n=adhkarTitle] { opacity:0; max-height:0; margin:0; }
.nav-btn[hidden] { display:none; }
.goal { white-space:pre-line; }
.wirdrow { display:flex; align-items:center; justify-content:center; gap:1rem; margin:.4rem 0; }
.wirdrow button { width:3rem; height:3rem; border-radius:50%; font-size:1.4rem; padding:0; line-height:1; }
#stats-box.bigwird #wird-val { font-size:1.7rem; }
#stats-box.bigwird .wirdrow button { width:3.6rem; height:3.6rem; }
.qw { display:flex; align-items:center; justify-content:space-between; gap:.8rem; margin-top:.9rem; padding-top:.9rem; border-top:1px solid var(--border); }
.qw .qi { display:flex; align-items:center; gap:.7rem; min-width:0; text-align:start; }
.qw .qt { font-size:.85rem; line-height:1.5; } .qw .qt b { display:block; font-size:.78rem; font-weight:400; color:var(--muted); }
.wring.sm { width:2.9rem; height:2.9rem; flex:none; } .wring.sm circle { stroke-width:7; } .wring.sm span { font-size:.8rem; font-weight:700; }
.wring.done .fg { stroke:var(--ok); } .wring.sm.done span { color:var(--ok); }
.notice button, .hint button, .qw button { min-height:2.5rem; padding:.5rem 1rem; border-radius:.8rem; font-size:.9rem; white-space:nowrap; }
.tiny { font-size:.7rem; margin-top:.3rem; }
.pgrp { display:inline-flex; align-items:center; }
.pchk { margin-inline-start:.7rem; width:2rem; height:2rem; min-height:0; padding:0; border-radius:50%; flex:none; display:inline-grid; place-items:center; color:var(--muted); background:transparent; }
.pchk-sp { margin-inline-start:.7rem; width:2rem; height:2rem; flex:none; }
.pchk svg { width:1rem; height:1rem; stroke:currentColor; fill:none; stroke-width:3; }
.pchk.on { background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }
.naw-row { display:flex; justify-content:space-between; align-items:center; gap:.8rem; padding:.65rem .1rem; border-top:1px solid var(--border); font-size:.9rem; }
#upd-bar { position:fixed; top:0; inset-inline:0; z-index:70; display:flex; align-items:center; gap:.6rem; padding:.6rem 1rem; background:var(--surface); border-bottom:2px solid var(--accent); box-shadow:0 4px 16px rgba(0,0,0,.35); }
#upd-bar span { flex:1; font-weight:700; font-size:.9rem; } #upd-bar button { min-height:2.3rem; padding:.4rem .9rem; border-radius:.8rem; font-size:.85rem; }
.qjz b { cursor:pointer; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:manipulation; } .qjz b.hold { outline:2px solid var(--accent); }
.q-mem-row { display:block; width:100%; text-align:start; padding:.7rem .8rem; margin-bottom:.5rem; border-radius:.8rem; background:var(--hover); border:0; color:inherit; } .q-mem-row small { display:block; color:var(--muted); margin-top:.2rem; }
#splash { position:fixed; inset:0; z-index:120; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.4rem; padding:1.5rem; text-align:center; background:linear-gradient(135deg,var(--bg),var(--bg2)); transition:opacity .25s; } #splash[hidden] { display:none; } #splash.out { opacity:0; }

#splash .sp-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; width:100%; max-width:26rem; margin-top:1.6rem; } #splash .sp-grid div { padding:.55rem .3rem; border-radius:.7rem; background:var(--hover); } #splash .sp-grid div.on { background:var(--accent); color:var(--on-accent); } #splash .sp-grid small { display:block; opacity:.8; } #splash .sp-grid b { font-variant-numeric:tabular-nums; }

#wird-val {  font-size:1.2rem; font-weight:700; min-width:0; max-width:75%; text-align:center; }
.wbar { height:.35rem; border-radius:.2rem; background:var(--hover); overflow:hidden; margin:.15rem 0 .5rem; }
.wbar > i { display:block; height:100%; background:var(--accent); transform-origin:right; }
html[dir=ltr] .wbar > i { transform-origin:left; }
.trackgrid { display:grid; grid-template-columns:1.6fr 1fr 1fr 1fr; gap:.3rem; }
.tc { background:var(--hover); border-radius:.6rem; padding:.4rem .2rem; text-align:center; font-size:.8rem; color:var(--muted); }
.tc.th { background:none; color:var(--muted); font-size:.72rem; }
.tc.okc { color:var(--ok); font-weight:700; }

/* توحيد الأحجام والمسافات */
:root { --fs-label:.8rem; --fs-ctl:.9rem; --fs-note:.78rem; --fs-title:1.05rem; }
h3, .grp { font-size:var(--fs-title); font-weight:700; margin:0 0 .8rem; color:var(--accent); }
.grp { margin:1.3rem 0 .7rem; }
.grp:first-child { margin-top:0; }
.field { margin-bottom:1rem; }
.field > label, .timerow label, .grid2 label { font-size:var(--fs-label); }
.small { font-size:var(--fs-note); }
.switch { font-size:var(--fs-ctl); margin-bottom:.9rem; min-height:2.4rem; }
.opts summary { font-size:var(--fs-ctl); }
.abar button { font-size:var(--fs-label); min-height:2.2rem; }
.seg button { font-size:var(--fs-label); min-height:2.4rem; }
#adhkar-seg button { font-size:.74rem; }
.btn-block, .grid2 > button, select, input[type=time], input[type=text], input[type=number] { min-height:2.6rem; }
.detail, .bline, .tc { font-size:var(--fs-label); }
/* شاشة البدء */
#onb { position:fixed; inset:0; z-index:100; overflow:auto; background:linear-gradient(135deg,var(--bg),var(--bg2)); display:flex; align-items:center; justify-content:center; padding:1.2rem; }
#onb[hidden] { display:none; }
.onb-card { width:100%; max-width:420px; }
.onb-dots { display:flex; gap:.4rem; justify-content:center; margin-bottom:1.6rem; }
.onb-dots i { width:.5rem; height:.5rem; border-radius:99px; background:var(--border); transition:width .25s ease, background .25s ease; }
.onb-dots i.on { width:1.6rem; background:var(--accent); }
#onb h2 { margin:0 0 .4rem; text-align:center; color:var(--accent); }
#onb p { text-align:center; margin:0 0 1.4rem; }
.onb-opt { display:block; width:100%; margin-bottom:.7rem; padding:1rem; font-size:1.05rem; }
.onb-opt.on { background:var(--accent); color:var(--on-accent); font-weight:700; border-color:var(--accent); }
.onb-nav { display:flex; gap:.6rem; margin-top:1.4rem; }
.onb-nav button { flex:1; }
.onb-skip { display:block; margin:1rem auto 0; background:none; border:none; color:var(--muted); }

/* حلقة الصلاة القادمة */
.hero-ring { position:relative; width:15rem; height:15rem; margin:.5rem auto .2rem; }
.hero-ring svg { position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
.hero-ring circle { fill:none; }
.hr-bg { stroke:var(--border); stroke-width:3; }
.hr-pg { stroke:var(--accent); stroke-width:3.6; stroke-linecap:round; stroke-dasharray:289.03; stroke-dashoffset:289.03; transition:stroke-dashoffset .9s linear; }
.hero-in { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
/* الطباعة / PDF */
#print-sheet { display:none; }
@media print {
    @page { size:A4; margin:0; }
    html, body { background:none !important; }
    body.printing > *:not(#print-sheet) { display:none !important; }
    body.printing #print-sheet { display:flex; align-items:center; justify-content:center; width:210mm; height:297mm; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    #print-sheet img { max-width:100%; max-height:100%; }
}

/* بطاقة اليوم */
.hero-dates { display:flex; flex-wrap:wrap; justify-content:center; gap:.15rem 1rem; margin-top:.4rem; }
.notice { margin-top:.9rem; padding-top:.9rem; border-top:1px solid var(--border); text-align:start; }
.pills { display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.45rem; }
.pill { padding:.25rem .75rem; border-radius:99px; font-size:var(--fs-label); background:var(--hover); color:var(--muted); border:1px solid transparent; }
.pill.on { background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }
.detail { min-height:3.4rem; }
/* وضع اليد الواحدة */
html.onehand #abar { position:fixed; inset-inline:1rem; bottom:calc(4.6rem + env(safe-area-inset-bottom)); z-index:15; max-width:420px; margin:0 auto; justify-content:space-between;
    background:var(--surface); border:1px solid var(--border); border-radius:99px; padding:.4rem .9rem; box-shadow:0 6px 18px rgba(0,0,0,.3); transition:bottom .28s ease; }
html.onehand.nav-away #abar { bottom:calc(1rem + env(safe-area-inset-bottom)); }
html.onehand.focus #abar { bottom:4.6rem; }
html.onehand #tab-adhkar { padding-bottom:3.8rem; }
[hidden] { display:none !important; }
</style>

<script>
/* ENGINE START */
/* ===== محرك حساب المواقيت (فلكي، بدون إنترنت) ===== */
const PT_METHODS = {
    5:  { fajr:19.5, isha:17.5 },                              // الهيئة المصرية
    4:  { fajr:18.5, isha:{ min:90 }, ishaRamadan:120 },       // أم القرى
    3:  { fajr:18,   isha:17 },                                // رابطة العالم الإسلامي
    2:  { fajr:15,   isha:15 },                                // ISNA
    1:  { fajr:18,   isha:18 },                                // كراتشي
    8:  { fajr:19.5, isha:{ min:90 } },                        // الخليج
    9:  { fajr:18,   isha:17.5 },                              // الكويت
    10: { fajr:18,   isha:{ min:90 } },                        // قطر
    13: { fajr:18,   isha:17 },                                // ديانت تركيا
    21: { fajr:19,   isha:17, off:{ Sunrise:-3, Dhuhr:5, Maghrib:5 } }, // المغرب (الأوقاف)
    19: { fajr:18,   isha:17 },                                // الجزائر
    18: { fajr:18,   isha:18 },                                // تونس
    17: { fajr:20,   isha:18 },                                // ماليزيا (JAKIM)
    11: { fajr:20,   isha:18 },                                // سنغافورة (MUIS)
    20: { fajr:20,   isha:18 },                                // إندونيسيا
    12: { fajr:12,   isha:12 }                                 // فرنسا (UOIF)
};
function ptSin(d){ return Math.sin(d * Math.PI / 180); }
function ptCos(d){ return Math.cos(d * Math.PI / 180); }
function ptTan(d){ return Math.tan(d * Math.PI / 180); }
function ptAsin(x){ return Math.asin(x) * 180 / Math.PI; }
function ptAcos(x){ return Math.acos(x) * 180 / Math.PI; }
function ptAcot(x){ return Math.atan(1 / x) * 180 / Math.PI; }
function ptAtan2(y, x){ return Math.atan2(y, x) * 180 / Math.PI; }
function ptFix(a, b){ a = a - b * Math.floor(a / b); return a < 0 ? a + b : a; }
function ptJulian(y, m, d){
    if (m <= 2) { y -= 1; m += 12; }
    const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
    return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
}
function ptSun(jd){
    const D = jd - 2451545.0;
    const g = ptFix(357.529 + 0.98560028 * D, 360);
    const q = ptFix(280.459 + 0.98564736 * D, 360);
    const L = ptFix(q + 1.915 * ptSin(g) + 0.020 * ptSin(2 * g), 360);
    const e = 23.439 - 0.00000036 * D;
    const RA = ptAtan2(ptCos(e) * ptSin(L), ptCos(L)) / 15;
    return { decl: ptAsin(ptSin(e) * ptSin(L)), eqt: q / 15 - ptFix(RA, 24) };
}
// يرجّع الأوقات بالساعات (بتوقيت UTC) لليوم المدني y-m-d
function ptCompute(o){
    const P = PT_METHODS[o.method] || PT_METHODS[5];
    const lat = o.lat, lng = o.lng;
    const jd0 = ptJulian(o.y, o.m, o.d) - lng / (15 * 24);
    const sunPos = t => ptSun(jd0 + t / 24);
    const midDay = t => ptFix(12 - sunPos(t).eqt, 24);
    const angleTime = (angle, t, ccw) => {
        const decl = sunPos(t).decl;
        const v = (-ptSin(angle) - ptSin(decl) * ptSin(lat)) / (ptCos(decl) * ptCos(lat));
        if (!(v >= -1 && v <= 1)) return NaN;
        const T = ptAcos(v) / 15;
        return midDay(t) + (ccw ? -T : T);
    };
    const asrTime = (f, t) => {
        const decl = sunPos(t).decl;
        return angleTime(-ptAcot(f + ptTan(Math.abs(lat - decl))), t, false);
    };
    const nz = (v, def) => Number.isFinite(v) ? v : def;
    let t = { Fajr:5, Sunrise:6, Dhuhr:12, Asr:13, Sunset:18, Isha:18 };
    for (let i = 0; i < 2; i++) {
        t = {

    const raw = {

const HISN = [["أذكار الصباح والمساء",[["أَعُوذُ بِاللَّهِ مِنَ الشَّيطَانِ الرَّجِيمِ ﴿اللَّهُ لاَ إِلَهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ لاَ تَأْخُذُهُ سِنَةٌ وَلاَ نَوْمٌ لَّهُ مَا فِي السَّمَوَاتِ وَمَا فِي الأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلاَّ بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلاَ يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلاَّ بِمَا شَاء وَسِعَ كُرْسِيُّهُ السَّمَوَاتِ وَالْأَرْضَ وَلاَ يَؤُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ﴾.",1],["بسم الله الرحمن الرحيم ﴿قُلْ هُوَ اللَّهُ أَحَدٌ* اللَّهُ الصَّمَدُ* لَمْ يَلِدْ وَلَمْ يُولَدْ* وَلَمْ يَكُن لَّهُ كُفُواً أَحَدٌ﴾. بسم الله الرحمن الرحيم ﴿قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ* مِن شَرِّ مَا خَلَقَ* وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ* وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ* وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ﴾. بسم الله الرحمن الرحيم ﴿قُلْ أَعُوذُ بِرَبِّ النَّاسِ* مَلِكِ النَّاسِ* إِلَهِ النَّاسِ* مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ* الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ* مِنَ الْجِنَّةِ وَ النَّاسِ﴾ (ثلاثَ مرَّاتٍ).",3],["((أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ ، وَالْحَمْدُ لِلَّهِ، لاَ إِلَهَ إلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيرَ مَا بَعْدَهُ ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ)). [ وإذا أمسى قال: أمسينا وأمسى الملك للَّه] [وإذا أمسى قال: رب أسألك خير ما في هذه الليلة، وخير ما بعدها، وأعوذ بك من شر ما في هذه الليلة، وشر ما بعدها.]",1],["((اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا ، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ)). [وإذا أمسى قال: اللَّهم بك أمسينا، وبك أصبحنا، وبك نحيا، وبك نموت، وإليك المصير.]",1],["((اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلاَّ أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا
